spring:
  application:
    name: joblens-backend
  servlet:
    multipart:
      # Deliberately a little above joblens.resume.max-file-size-bytes so that an oversized upload
      # is reported by the application with actionable copy rather than by the container.
      max-file-size: 12MB
      max-request-size: 13MB

server:
  port: 8080
  # Error bodies are produced exclusively by GlobalExceptionHandler as RFC 9457 problem details.
  # The container defaults are suppressed so no stack trace or internal message can leak.
  error:
    whitelabel:
      enabled: false
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      access: read-only

logging:
  level:
    root: INFO
    com.joblens: INFO

joblens:
  resume:
    max-file-size-bytes: 10485760   # 10 MiB
    max-page-count: 15
    # Below this many usable characters the document cannot be analysed honestly.
    min-usable-characters: 400
    # Guards against decompression and content-explosion abuse. Extraction stops here.
    max-extracted-characters: 500000
  job-posting:
    # Shorter than this and there is nothing meaningful to compare a resume against.
    min-text-characters: 200
    max-text-characters: 40000
  job-fetch:
    # Fetching a user-supplied URL from the server is the highest-risk capability in the product.
    # Every value here is a containment boundary, not a tuning knob.
    connect-timeout: 2s
    response-timeout: 5s
    total-timeout: 10s
    max-response-bytes: 2097152     # 2 MiB, enforced while streaming
    max-redirects: 3
    allowed-ports: [80, 443]
    max-concurrent-fetches: 4
    user-agent: JobLensBot/0.1 (+https://joblens.local/bot)
  cors:
    # The local Vite dev server. Production origins are configured per environment.
    allowed-origins:
      - http://localhost:5173
  analysis:
    # "fake" is the only provider available today. It never leaves the local process,
    # so the application runs end to end without any API key or outbound AI traffic.
    provider: fake
