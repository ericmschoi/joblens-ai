# Deployment. Manual dispatch only.
#
# This workflow is never triggered by a push, a merge, a tag, a schedule or another workflow. It
# exists so that deploying is a decision someone makes and can be seen to have made, with the run,
# the actor and the inputs recorded.
#
# It is the only thing in this repository that can spend money. Three separate brakes:
#   1. workflow_dispatch only — no automatic trigger of any kind
#   2. `environment: production` — GitHub can require a named reviewer before the job starts
#   3. a typed confirmation input — "deploy" and nothing else lets the job run
#
# It also needs an AWS role that does not exist yet. Until one is created and its ARN is stored as
# the AWS_DEPLOY_ROLE_ARN variable, every run of this workflow fails at the credentials step
# without having created anything.

name: Deploy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm this will create billable AWS resources'
        required: true
        type: string
      stack:
        description: 'Which stack to deploy'
        required: true
        type: choice
        options: [registry, application, both]
        default: both

permissions:
  contents: read
  id-token: write # OIDC, so no long-lived AWS key is ever stored in this repository

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ca-central-1

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check the confirmation
        if: inputs.confirm != 'deploy'
        run: |
          echo "::error::Deployment not confirmed. Re-run and type deploy in the confirm input."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'

      # Nothing is deployed that has not passed the same checks a pull request has to pass.
      - name: Backend build and test
        working-directory: backend
        run: ./gradlew --no-daemon build

      - name: Frontend checks and build
        working-directory: frontend
        run: npm ci && npm run typecheck && npm run lint && npm test && npm run build

      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install the CDK toolchain
        working-directory: infrastructure
        run: npm ci

      # --- registry: an empty repository, which costs nothing until an image is pushed ----------
      - name: Deploy the registry stack
        if: inputs.stack == 'registry' || inputs.stack == 'both'
        working-directory: infrastructure
        run: npx cdk deploy JoblensRegistry --require-approval never

      # --- the image ---------------------------------------------------------------------------
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        if: inputs.stack == 'application' || inputs.stack == 'both'

      - name: Log in to ECR
        if: inputs.stack == 'application' || inputs.stack == 'both'
        id: ecr
        uses: aws-actions/amazon-ecr-login@b040164c4934333d597f3f9c67502ff28f814e9c # v2.1.6

      - name: Build and push the backend image
        if: inputs.stack == 'application' || inputs.stack == 'both'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.lambda
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/joblens-backend:sha-${{ github.sha }}
          provenance: false

      # --- the application ---------------------------------------------------------------------
      - name: Deploy the application stack
        if: inputs.stack == 'application' || inputs.stack == 'both'
        working-directory: infrastructure
        run: |
          npx cdk deploy JoblensApplication \
            --require-approval never \
            -c imageTag=sha-${{ github.sha }} \
            -c budgetAlertEmail=${{ vars.BUDGET_ALERT_EMAIL }} \
            --outputs-file outputs.json
          cat outputs.json

      - name: Smoke test the deployment
        if: inputs.stack == 'application' || inputs.stack == 'both'
        working-directory: infrastructure
        run: |
          url=$(python3 -c "import json;print(json.load(open('outputs.json'))['JoblensApplication']['SiteUrl'])")
          echo "Deployed to $url"
          # The first API call also pays for the cold start, so this is patient on purpose.
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 90 "$url" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 90 \
            -X POST "$url/api/v1/job-descriptions/extract" \
            -H 'Content-Type: application/json' \
            -d '{"text":"short"}' -o /dev/null -w 'API answered %{http_code}\n' || true
