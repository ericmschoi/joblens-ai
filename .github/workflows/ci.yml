# Everything that must pass before a change reaches main, run the same way it runs locally.
#
# This workflow deploys nothing and touches no cloud account. It has no credentials, no OIDC role
# and no registry login, and it cannot acquire them: merging a pull request costs nothing.
#
# Actions are pinned to commit SHAs rather than tags. A tag can be repointed at new code by whoever
# owns the action; a SHA cannot, and an action runs with access to the workflow's context.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build and test
        working-directory: backend
        run: ./gradlew --no-daemon build

      # Browser-tagged tests are excluded from `build` because they download Chromium. They are not
      # run here either; that is a deliberate gap, recorded rather than hidden.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/
          retention-days: 7

  frontend:
    name: Frontend — typecheck, lint, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install exactly the lockfile
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Production build
        working-directory: frontend
        run: npm run build

  infrastructure:
    name: Infrastructure — typecheck, test, synth
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            infrastructure/package-lock.json

      # Synthesis embeds the built SPA, so it has to exist first.
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install the CDK toolchain
        working-directory: infrastructure
        run: npm ci

      - name: Typecheck
        working-directory: infrastructure
        run: npm run typecheck

      - name: Test the synthesized templates
        working-directory: infrastructure
        run: npm test

      # Synthesis only. No credentials are configured in this workflow, and the stacks contain no
      # context lookups, so this produces CloudFormation locally and talks to no AWS account.
      - name: Synthesize
        working-directory: infrastructure
        run: npx cdk synth --quiet -c imageTag=sha-ci -c budgetAlertEmail=ci@example.com

  images:
    name: Container images — build only
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Built and thrown away. Nothing is pushed anywhere: there is no registry credential in this
      # workflow, and a merge must never publish an artefact by itself.
      - name: Build the backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the backend Lambda image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: backend
          file: backend/Dockerfile.lambda
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: frontend
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
